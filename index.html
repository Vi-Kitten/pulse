<!DOCTYPE html>
<html>
    <head>
        <script>

class UnmountedError extends Error {
    constructor (comp) {
        super("Component not mounted");
        this.comp = comp;
    }
}

function Component(def) {return {
    async rhetorical() {
        const fut_x = this.mount(_ => {}, () => {});
        this.submit();
        return await fut_x;
    },
    map(f) {
        const base = this;
        return Component({
            submit() {
                base.submit();
            },
            async mount(render, flush) {
                const x = await base.mount(render, flush);
                return f(x);
            }
        });
    },
    applyTo(...compArgs) {
        return Component.array([this, ...compArgs]).map(([f, ...args]) => f(...args))
    },
    then(f) {
        const base = this;
        return Component({
            current: base,
            fastForward: false,
            submit() {
                this.fastForward = true;
                this.current.submit();
            },
            async mount(render, flush) {
                const current = this.current;
                const x = await current.mount(render, () => current.submit());
                this.current = f(x);
                if (this.fastForward) {
                    return await this.current.rhetorical();
                }
                return await this.current.mount(render, flush);
            }
        });
    },
    weakThen(f) {
        const base = this;
        return Component({
            current: base,
            skipping: false,
            submit() {
                this.skipping = true;
                this.current.submit();
            },
            async mount(render, flush) {
                const current = this.current;
                const x = await current.mount(render, () => current.submit());
                if (this.skipping) {
                    return x;
                }
                this.current = f(x);
                return await this.current.mount(render, flush);
            }
        });
    },
    loop(f) {
        const base = this;
        return Component({
            current: base,
            skipping: false,
            submit() {
                this.skipping = true;
                this.current.submit();
            },
            async mount(render, flush) {
                while (true) {
                const current = this.current;
                const x = await current.mount(render, () => current.submit());
                    if (this.skipping) {
                        return x;
                    }
                    this.current = f(x, x => {
                        flush();
                        return Component.done(x);
                    });
                }
            }
        });
    },
    ...def
}};

// shortcircuit rendering
Component.done = val => Component({
    submit() {},
    async mount(render, flush) {
        flush();
        return val;
    }
});

// render nothing, return value
Component.wrap = val => Component({
    submit() {
        throw new UnmountedError(this)
    },
    async mount(render, flush) {
        render([])
        return await new Promise(res => this.submit = () => res(val));
    }
});

// compute component lazily
Component.lazy = f => Component({
    inner: null,
    submit() {
        if (this.inner == null) {
            throw new UnmountedError(this);
        }
        this.inner.submit();
    },
    async mount(render, flush) {
        this.inner = f();
        return await this.inner.mount(render, flush);
    }
});

// array of components to a component of an array
Component.array = components => Component({
    submit() {
        for (const component of components) {
            component.submit()
        }
    },
    renderBuffer: Array(components.length).fill(null),
    render(..._) {
        throw new UnmountedError(this);
    },
    promptRender() {
        if (this.renderBuffer.includes(null)) {
            return; // cannot render yet
        }
        this.render(this.renderBuffer.flat());
    },
    async mount(render, flush) {
        this.render = render;
        return await Promise.all(
            components.map((component, i) =>
                component.mount(elems => {
                    this.renderBuffer[i] = elems;
                    this.promptRender();
                }, flush)
            )
        );
    }
});

// self updating value
Component.reactive = (x, f) => Component.done(x).loop(f);

function Html(html, spec = {}) {
    const temp = document.createElement('template');
    temp.innerHTML = html.trim();
    const elems = [...temp.content.children];
    let send = undefined;
    const submission = new Promise(res => send = res);
    const comp = Component({
        event: undefined,
        flush() {
            throw new UnmountedError(this);
        },
        submit() {
            for (const elem of elems) {
                elem.inert = true;
            }
            send(this.event);
        },
        mount(render, flush) {
            render(elems);
            this.flush = flush;
            return submission;
        }
    });
    if (spec.style !== undefined) {
        for (const elem of elems) {
            elem.style = spec.style;
        }
    }
    if (spec.onClick !== undefined) {
        for (const elem of elems) {
            elem.onclick = async (e) => {
                if (comp.event !== undefined) {
                    return
                }
                comp.event = null;
                comp.event = await spec.onClick(e);
                comp.flush();
            };
        }
    }
    // TODO: more interaction
    return comp;
}

async function renderRoot(comp) {
    await comp.mount(elems => document.body.replaceChildren(...elems), () => comp.submit());
    location.replace("about:blank");
}

        </script>
    </head>
    <body>
        <script>

renderRoot(Component.reactive(0, n => Component.array([
    Html("<button>+1</button>", {
        onClick(e) {}
    }),
    Html(`<p>${n}</p>`)
]).map(_ => n + 1)));

        </script>
    </body>
</html>
