<!DOCTYPE html>
<html>
    <head>
        <script>

class UnmountedError extends Error {
    constructor (comp) {
        super("Component not mounted");
        this.comp = comp;
    }
}

class DoubleSubmitError extends Error {
    constructor(comp) {
        super("Component submitted twice");
        this.comp = comp;
    }
}

function once(f) {
    let called = false;
    return (...args) => {
        if (called) return;
        called = true;
        return f(...args);
    };
};

async function painted() {
    await new Promise(res =>
        requestAnimationFrame(() => requestAnimationFrame(res))
    )
};

function Component(def) {return {
    rhetorical() {
        this.mount(_ => {}, () => {});
        return this.submit();
    },
    map(f) {
        const base = this;
        return Component({
            submit() {
                return f(base.submit());
            },
            mount(render, flush) {
                base.mount(render, flush);
            }
        });
    },
    applyTo(...compArgs) {
        return Component.array([this, ...compArgs]).map(([f, ...args]) => f(...args))
    },
    then(f) {
        // adapter for pre-do code
        const g = x => Component.do(ret => f(x, ret));
        const base = this;
        return Component({
            current: base,
            submit() {
                if (this.current === base) {
                    return g(this.current.submit()).rhetorical()
                }
                return this.current.submit();
            },
            mount(render, flush) {
                base.mount(render, once(() => (this.current = g(base.submit())).mount(render, flush)));
            }
        });
    },
    weakThen(f) {
        // adapter for pre-do code
        const g = x => Component.do(ret => f(x, ret));
        const base = this;
        return Component({
            current: base,
            submit() {
                return this.current.submit();
            },
            mount(render, flush) {
                base.mount(render, once(() => (this.current = g(base.submit())).mount(render, flush)));
            }
        });
    },
    loop(f) {
        // adapter for pre-do code
        const g = (x, brk) => Component.do(cont => f(x, cont, brk));
        const base = this;
        return Component({
            current: base,
            breaking: false,
            submit() {
                return this.current.submit();
            },
            mount(render, flush) {
                if (this.breaking) {
                    return;
                }
                const current = this.current;
                current.mount(render, once(() => {
                    this.current = g(current.submit(), val => {
                        if (this.breaking) return;
                        this.breaking = true;
                        this.submit = () => val;
                        flush();
                    });
                    this.mount(render, flush);
                }));
            }
        });
    },
    ...def
}};

// shortcircuit rendering
Component.done = val => Component({
    mounted: false,
    submit() {
        if (!this.mounted) {
            throw new UnmountedError(this);
        }
        this.submit = () => { throw new DoubleSubmitError(); };
        return val;
    },
    mount(render, flush) {
        this.mounted = true;
        flush();
    }
});

// render nothing, return value
Component.wrap = val => Component({
    mounted: false,
    submit() {
        if (!this.mounted) {
            throw new UnmountedError(this);
        }
        this.submit = () => { throw new DoubleSubmitError(); };
        return val;
    },
    mount(render, flush) {
        this.mounted = true;
        render([]);
    }
});

// lazy component with an early return hook
Component.do = f => Component({
    submit() {
        throw new UnmountedError(this);
    },
    mount(render, flush) {
        let returned = false;
        const inner = f(val => {
            returned = true;
            this.submit = () => val;
            flush();
        });
        if (!returned) {
            this.submit = () => inner.submit();
            inner.mount(render, flush);
        }
    }
});

// array of components to a component of an array
Component.array = components => Component({
    submit() {
        return components.map(component => component.submit());
    },
    renderBuffer: Array(components.length).fill(null),
    render(..._) {
        throw new UnmountedError(this);
    },
    promptRender() {
        if (this.renderBuffer.includes(null)) return;
        this.render(this.renderBuffer.flat());
    },
    mount(render, flush) {
        this.render = render;
        components.forEach((component, i) => component.mount(
            elems => {
                this.renderBuffer[i] = elems;
                this.promptRender();
            },
            flush
        ));
    }
});

// self updating value
Component.reactive = (x, f) => Component.done(x).loop(f);

function Html(html, spec = {}) {
    const temp = document.createElement('template');
    temp.innerHTML = html.trim();
    const elems = [...temp.content.children];
    const comp = Component({
        val: null,
        mounted: false,
        flush() {
            throw new UnmountedError(this);
        },
        submit() {
            if (!this.mounted) {
                throw new UnmountedError(this);
            }
            this.submit = () => {
                throw new DoubleSubmitError(this);
            };
            for (const elem of elems) {
                elem.inert = true;
            }
            return this.val;
        },
        mount(render, flush) {
            this.mounted = true;
            this.flush = flush;
            render(elems);
        }
    });
    let triggered = false;
    if (spec.style !== undefined) {
        for (const elem of elems) {
            elem.style = spec.style;
        }
    }
    if (spec.onClick !== undefined) {
        for (const elem of elems) {
            elem.onclick = async (e) => {
                if (triggered) {
                    return;
                }
                triggered = true;
                comp.val = await spec.onClick(e);
                comp.flush();
            };
        }
    }
    return comp;
}

function Tag(tagName, inner, spec = {}) {
    const elem = document.createElement(tagName);
    const comp = Component({
        submit() {
            return inner.submit();
        },
        mount(render, flush) {
            inner.mount(children => elem.replaceChildren(...children), flush);
            render([elem]);
        }
    });
    if (spec.style !== undefined) {
        elem.style = spec.style;
    }
    return comp;
}

async function renderRoot(comp) {
    let val = await new Promise(res => comp.mount(
        elems => document.body.replaceChildren(...elems),
        once(() => res(comp.submit())))
    );
    document.body.replaceChildren();
    if (val !== undefined) {
        await painted();
        alert(val);
    }
    location.replace("about:blank");
}

        </script>
    </head>
    <body>
        <script>

renderRoot(Component.reactive(0, (n, cont, brk) => Component.array([
    Tag("div", Component.array([
        Html("<button>+1</button>", {
            onClick: _ => cont(n + 1)
        }),
        Html(`<p>${n}</p>`),
        Html("<button>-1</button>", {
            onClick: _ => cont(n - 1)
        }),
    ]), {
        style: "border: solid black; display: inline-block;",
    }),
    Html("<button>finish</button>", {
        onClick: _ => brk(n)
    })
])));

        </script>
    </body>
</html>
