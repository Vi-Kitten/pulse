<!DOCTYPE html>
<html>
    <head>
        <script>

function once(f) {
    let called = false;
    return (...args) => {
        if (called) return;
        called = true;
        return f(...args);
    };
};

async function painted() {
    await new Promise(res =>
        requestAnimationFrame(() => requestAnimationFrame(res))
    )
};

function Component (mountFn) {
    const mount = (render, flush) => {
        let submitted = false;
        const submit = mountFn(render, flush);
        return () => {
            if (submitted) throw new Error("component submitted twice");
            submitted = true;
            return submit();
        };
    }
    const root = (render, resolve) => {
        let submit = null;
        const run = once(() => resolve(submit()));
        let fastFlush = false;
        submit = mountFn(render, () => submit == null
            ? fastFlush = true
            : run()
        );
        if (fastFlush) run();
        return () => { run() };
    };
    return {
        mount,
        root,
        rhetorical: () => mount(_ => {}, () => {})(),
        map: f => Component((render, flush) => {
            const submit = mount(render, flush);
            return () => f(submit());
        }),
        applyTo: (...compArgs) => Component.array([Component(mount), ...compArgs]).map(([f, ...args]) => f(...args)),
        then: f => Component((render, flush) => {
            let submit = null;
            const run = root(render, val =>
                submit = Component.do(ret => f(val, ret)).mount(render, flush)
            );
            return () => {
                run();
                return submit()
            };
        }),
        weakThen: f => Component((render, flush) => {
            let skipping = false;
            let submit = null;
            const run = root(render, val => skipping
                ? submit = () => val
                : submit = Component.do(ret => f(val, ret)).mount(render, flush)
            );
            return () => {
                skipping = true;
                run();
                return submit()
            };
        }),
        loop: f => Component((render, flush) => {
            let run = null;
            let breakWith = null;
            let breakVal = undefined;
            function continueWith(root) {
                run = root(render, val => breakWith
                    ? breakWith(val)
                    : continueWith(Component.do(cont => f(val, cont, val => {
                        // on break
                        breakVal = val;
                        breakWith = _ => {};
                        flush();
                    })).root)
                )
            }
            continueWith(root);
            return () => {
                if (breakWith == null) {
                    breakWith = val => breakVal = val;
                    run()
                }
                return breakVal;
            };
        })
    }
};

// shortcircuit rendering
Component.done = val => Component((render, flush) => {
    flush();
    return () => val;
});

// render nothing, return value
Component.wrap = val => Component((render, flush) => {
    render([]);
    return () => val;
});

// lazy component with an early return hook
Component.do = f => Component((render, flush) => {
    let returned = false;
    let ret = undefined;
    const inner = f(val => {
        returned = true;
        ret = val;
        flush();
    });
    const submit = inner.mount(render, flush);
    return () => returned ? ret : submit();
});

// array of components to a component of an array
Component.array = components => Component((render, flush) => {
    const renderBuffer = Array(components.length).fill(null);
    const submits = components.map((component, i) => component.mount(
        elems => {
            renderBuffer[i] = elems;
            if (renderBuffer.includes(null)) return;
            render(renderBuffer.flat());
        },
        flush
    ));
    return () => submits.forEach(submit => submit());
});

// self updating value
Component.reactive = (x, f) => Component.done(x).loop(f);

function Html(html, spec = {}) {
    const temp = document.createElement('template');
    temp.innerHTML = html.trim();
    const elems = [...temp.content.children];
    let handle = undefined;
    if (spec.style !== undefined) {
        for (const elem of elems) {
            elem.style = spec.style;
        }
    }
    if (spec.onClick !== undefined) {
        for (const elem of elems) {
            elem.onclick = async (e) => handle(spec.onClick(e))
        }
    }
    let val = null;
    return Component((render, flush) => {
        handle = eventVal => {
            val = eventVal;
            for (const elem of elems) {
                elem.inert = true;
            }
            flush();
        };
        render(elems);
        return () => val;
    })
}

function Tag(tagName, inner, spec = {}) {
    const elem = document.createElement(tagName);
    if (spec.style !== undefined) {
        elem.style = spec.style;
    }
    return Component((render, flush) => {
        render([elem]);
        return inner.mount(children => elem.replaceChildren(...children), flush);
    });
}

async function renderRoot(comp) {
    let val = await new Promise(res => comp.root(
        elems => document.body.replaceChildren(...elems),
        res
    ));
    document.body.replaceChildren();
    if (val !== undefined) {
        await painted();
        alert(val);
    }
    location.replace("about:blank");
}

        </script>
    </head>
    <body>
        <script>

renderRoot(Component.reactive(0, (n, cont, brk) => Component.array([
    Tag("div", Component.array([
        Html("<button>+1</button>", {
            onClick: _ => cont(n + 1)
        }),
        Html(`<p>${n}</p>`),
        Html("<button>-1</button>", {
            onClick: _ => cont(n - 1)
        }),
    ]), {
        style: "border: solid black; display: inline-block;",
    }),
    Html("<button>finish</button>", {
        onClick: _ => brk(n)
    })
])));

        </script>
    </body>
</html>
