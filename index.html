<!DOCTYPE html>
<html>
    <head>
        <script>

// TODO: consider moving onRenders responsibilities into prime
function Component(def) {return {
    map(f) {
        const base = this;
        return Component({
            onRender(handler) {
                return base.onRender(handler)
            },
            render() {
                base.render()
            },
            submit() {
                base.submit()
            },
            async prime(submitAll) {
                const x = await base.prime(submitAll);
                f(x)
            }
        });
    },
    
    ...def
}}

Component.wrap = val => Component({
    onRender(handler) {},
    render() {},
    submit() {},
    async prime(submitAll) {
        submitAll();
        return val;
    }
});

function Html(html, spec) {
    const temp = document.createElement('template');
    temp.innerHTML = html.trim();
    const elems = temp.content.children;
    let send = undefined;
    const submission = new Promise((res, _) => send = res);
    let comp = Component({
        event: null,
        render() {},
        onRender(handler) {
            this.render = () => handler(elems)
        },
        submitAll() {
            throw new Error("component not primed");
        },
        submit() {
            for (const elem of elems) {
                elem.inert = true;
            }
            send(this.event);
        },
        prime(submitAll) {
            this.submitAll = submitAll;
            return submission;
        }
    });
    if (spec.style !== undefined) {
        for (const elem of elems) {
            elem.style = spec.style;
        }
    }
    if (spec.onClick !== undefined) {
        for (const elem of elems) {
            elem.onclick = (e) => {
                comp.event ??= spec.onClick(e);
                comp.submitAll();
            };
        }
    }
    // TODO: more interaction
    return comp;
}

function renderRoot(comp) {
    comp.onRender(elems => document.body.replaceChildren(...elems));
    comp.render();
    comp.prime(() => comp.submit()).then((_) => {
        document.body.replaceChildren();
        location.replace("about:blank");
    });
}

        </script>
    </head>
    <body>
        <script>

renderRoot(Html("<h1>Hello World!</h1>", {
    onClick(e) {
        return "Clicked!"
    }
}).map(msg => console.log(msg)));

        </script>
    </body>
</html>
